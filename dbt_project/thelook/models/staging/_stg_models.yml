version: 2

models:
  - name: stg_orders
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: user_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: user_id
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Shipped', 'Complete', 'Processing', 'Cancelled', 'Returned']
      - name: ordered_at
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "<= '{{ var('as_of_date') }}'"

  - name: stg_order_items
    columns:
      - name: order_item_id
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: user_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: user_id
      - name: inventory_item_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_inventory_items')
                field: inventory_item_id
      - name: line_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Shipped', 'Complete', 'Processing', 'Cancelled', 'Returned']
      - name: ordered_at
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "<= '{{ var('as_of_date') }}'"
      - name: sale_price
        tests:
          - not_null

  - name: stg_products
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
      - name: distribution_center_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_distribution_centers')
                field: id

  - name: stg_users
    columns:
      - name: user_id
        tests:
          - unique
          - not_null

  - name: stg_inventory_items
    columns:
      - name: inventory_item_id
        tests:
          - unique
          - not_null
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: cost
        tests:
          - not_null

  - name: stg_distribution_centers
    columns:
      - name: id
        tests:
          - unique
          - not_null
